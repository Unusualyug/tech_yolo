name: TRINEXIS tests and evidence boundary

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal CI dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt
      - name: Compile Python sources
        run: python -m compileall -q app23.py app.py camera_test.py trinexis_core.py trinexis_telemetry.py trinexis_language.py experiments tests scripts paper
      - name: Run route and policy tests
        run: python -m unittest discover -s tests -v
      - name: Verify committed test-count summary
        run: python scripts/report_test_counts.py --check
      - name: Verify experiment harnesses (no empirical data)
        run: |
          python experiments/latency_benchmark.py --self-check
          python experiments/detection_eval.py --self-check
          python experiments/vocab_confidence_grid.py --self-check
          python experiments/alert_replay.py --self-check
          python experiments/language_eval.py --self-check
      - name: Verify evidence boundary
        run: python scripts/verify_no_fabricated_results.py
